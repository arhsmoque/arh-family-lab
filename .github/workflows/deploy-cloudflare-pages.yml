name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build app local configs from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_ROOT_FAMILY_HUB: ${{ secrets.FIREBASE_ROOT_FAMILY_HUB }}
          FIREBASE_ROOT_STUDIO: ${{ secrets.FIREBASE_ROOT_STUDIO }}
        run: |
          node scripts/build-family-hub-config.mjs
          node scripts/build-studio-config.mjs
      - name: Prepare deploy bundle
        run: |
          mkdir -p dist
          cp -r index.html clinical.html AGENTS.md README.md SECRETS.md shared apps previews clinical dist/
          find dist/clinical -type d -name downloads -exec rm -rf {} +
          touch dist/.nojekyll
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=arh-family-lab --branch=main
