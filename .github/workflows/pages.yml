name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build app local configs from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_ROOT_FAMILY_HUB: ${{ secrets.FIREBASE_ROOT_FAMILY_HUB }}
          FIREBASE_ROOT_STUDIO: ${{ secrets.FIREBASE_ROOT_STUDIO }}
        run: |
          node scripts/build-family-hub-config.mjs
          node scripts/build-studio-config.mjs
      - name: Prepare deploy bundle
        run: |
          mkdir -p dist
          # Copy the static surface of the site, mirroring repo root paths.
          cp -r index.html clinical.html AGENTS.md README.md SECRETS.md shared apps previews clinical dist/
          # Drop heavy downloads that bloat the Pages artifact; the landing links stay.
          find dist/clinical -type d -name downloads -exec rm -rf {} +
          # Disable Jekyll (not used, but avoids any surprises).
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      - id: deployment
        uses: actions/deploy-pages@v4
