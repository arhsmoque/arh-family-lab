name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build app local configs from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_ROOT_FAMILY_HUB: ${{ secrets.FIREBASE_ROOT_FAMILY_HUB }}
          FIREBASE_ROOT_STUDIO: ${{ secrets.FIREBASE_ROOT_STUDIO }}
        run: |
          node scripts/build-family-hub-config.mjs
          node scripts/build-studio-config.mjs
      - name: Prepare deploy bundle
        run: |
          mkdir -p dist
          cp -r index.html clinical.html AGENTS.md README.md SECRETS.md shared apps previews clinical dist/
          find dist/clinical -type d -name downloads -exec rm -rf {} +
          touch dist/.nojekyll
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
